---
# Install kro.run
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kro
spec:
  interval: 1m0s
  url: oci://ghcr.io/kro-run/kro/kro
  ref:
    semver: "0.4.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kro
  namespace: default
spec:
  interval: 10m
  targetNamespace: kro
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: kro
    namespace: default
---
# Install ocm-k8s-toolkit
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ocm-k8s-toolkit
  namespace: default
spec:
  interval: 1m0s
  url: https://github.com/open-component-model/open-component-model
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ocm-k8s-toolkit
  namespace: default
spec:
  interval: 1m
  targetNamespace: ocm-k8s-toolkit-system
  sourceRef:
    kind: GitRepository
    name: ocm-k8s-toolkit
  path: "./kubernetes/controller/config/default"
  prune: true
  timeout: 1m
  patches:
    - patch: |
        - op: replace
          path: /roleRef/name
          value: cluster-admin # TODO: change to more restrictive role
      target:
        kind: ClusterRoleBinding
        name: ocm-k8s-toolkit-manager-rolebinding
    # - patch: |-
    #     apiVersion: rbac.authorization.k8s.io/v1
    #     kind: ClusterRoleBinding
    #     metadata:
    #       name: ocm-k8s-toolkit-manager-rolebinding
    #     roleRef:
    #       apiGroup: rbac.authorization.k8s.io
    #       kind: ClusterRole
    #       name: cluster-admin # TODO: change to more restrictive role
    #   target:
    #     kind: ClusterRoleBinding
    #     name: ocm-k8s-toolkit-manager-rolebinding
---

